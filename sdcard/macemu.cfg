# Mac Emulator settings.  Lines starting with # are comments.
# The F12 menu can change most of these and save them back here.

# ROM image on the SD card.  Leave empty to look for mac.rom, MacPlus.rom,
# Plus.rom, vMac.ROM, mac512ke.rom or Mac128K.rom.
rom=

# Memory in KB: 128, 512, 1024, 2048 or 4096 (64K ROMs use at most 512).
ram=4096

# Floppy images inserted at power-on (400K/800K raw or DiskCopy 4.2).
# A bare name is looked up in disk_dir.
floppy1=
floppy2=

# SCSI hard disks, IDs 0-6.  If not set, hd0.img ... hd6.img are used
# when they exist.  Images are raw disk dumps (as used by Mini vMac,
# BasiliskII "hardfile"s with a partition map, or real SCSI disk dumps).
#hd0=hd0.img

# Folder that the F12 floppy picker lists.
disk_dir=disks

# Emulation speed: 1, 2, 4, 8 or max.
speed=1

# Screen zoom: 0 = largest whole number that fits.
scale=0

# Display mode; 0 = what the monitor prefers.
width=0
height=0

# Colours: 0 black & white, 1 paper, 2 green phosphor, 3 amber, 4 LCD, 5 inverted.
palette=0

# Sound: 1 on, 0 off.  sound_device is hdmi or pwm (headphone jack).
sound=1
volume=8
sound_device=hdmi

# Mouse speed 1-8 (4 = one Mac pixel per mouse count).
mouse_speed=4

# 0: Alt = Command, Windows key = Option.  1: the other way round.
alt_is_option=0

# 1: never write to floppy images.
floppy_readonly=0

# The Pi has no battery-backed clock.  The Mac's clock starts here
# ("YYYY-MM-DD HH:MM"); empty = the date the emulator was built.
date=
