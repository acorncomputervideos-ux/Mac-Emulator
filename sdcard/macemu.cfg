# Mac Emulator settings.  Lines starting with # are comments.
# The F12 menu can change most of these and save them back here.

# ROM image on the SD card.  Leave empty to look for mac.rom, MacPlus.rom,
# Plus.rom, vMac.ROM, mac512ke.rom or Mac128K.rom.
rom=

# Model: auto (from the ROM's size), plus, ii or quadra.
machine=auto

# Memory in KB, a power of two: 512 ... 131072.  The Mac Plus uses at most
# 4096 (64K ROMs 512); the Quadra needs at least 8192.
ram=8192

# Mac II screen: 640x480, 832x624 or 1024x768.
video=640x480

# Quadra monitor: vga (640x480; 800x600 can be picked in the Mac's Monitors
# control panel) or 21 (Apple 21-inch display, 1152x870).
monitor=vga

# Floppy images inserted at power-on (400K/800K raw or DiskCopy 4.2).
# A bare name is looked up in disk_dir.
floppy1=
floppy2=

# SCSI hard disks, IDs 0-6.  If not set, hd0.img ... hd6.img are used
# when they exist; "none" means no disk at that ID.  Images are raw disk dumps (as used by Mini vMac,
# BasiliskII "hardfile"s with a partition map, or real SCSI disk dumps).
#hd0=hd0.img

# CD-ROM drive: an .iso, .toast or .cdr image (Mac CDs need Apple's CD-ROM
# extension in the System Folder, as on a real Mac).  cdrom_id is the
# drive's SCSI ID (none: no drive).
cdrom=
cdrom_id=3

# Folder that the F12 floppy and hard disk pickers list (as well as the
# top of the card, for hard disks).
disk_dir=disks

# Emulation speed: 1, 2, 4, 8 or max.
speed=1

# Screen zoom: 0 = largest whole number that fits.
scale=0

# smooth: the Pi scales the picture to fill the screen height.
# sharp: whole-number scaling with square pixels (sets scaling_kernel=8 in
# config.txt when changed from the menu).
scaling=smooth

# Display mode; 0 = what the monitor prefers.
width=0
height=0

# Colours: 0 black & white, 1 paper, 2 green phosphor, 3 amber, 4 LCD, 5 inverted.
palette=0

# Sound: 1 on, 0 off.  sound_device is hdmi or pwm (headphone jack).
sound=1
volume=8
sound_device=hdmi

# Mouse speed 1-8 (4 = one Mac pixel per mouse count).
mouse_speed=4

# 0: Alt = Command, Windows key = Option.  1: the other way round.
alt_is_option=0

# 1: never write to floppy images.
floppy_readonly=0

# Network for the web file manager (http://macemu.local/):
#   auto      Wi-Fi if wifi_name is set (or wpa_supplicant.conf is on the
#             card), otherwise the Ethernet cable
#   wifi, ethernet or off
# The Wi-Fi name and password can also be typed in the F12 menu.
network=auto
wifi_name=
wifi_password=
# Two-letter country code: sets the Wi-Fi channels allowed.
wifi_country=GB

# A fixed address for the Pi instead of one from the router (DHCP), for a
# network without a router.  Empty = DHCP.
ip_address=
ip_netmask=
ip_gateway=

# Ethernet for the Quadra itself (choose "EtherTalk Built In" in the Mac's
# Network control panel).  Frames go over the Pi's network in UDP on this
# port, like Basilisk II's "udptunnel": off, or a port number (6066).
mac_ethernet=6066
# Internet for the Mac through the Pi (NAT): on or off.  In MacTCP or Open
# Transport choose Ethernet and DHCP/Server, or by hand: address
# 10.0.2.15, mask 255.255.255.0, router 10.0.2.2, name server 10.0.2.3.
mac_internet=on
# The HTTPS helper: lets the Mac's old browsers open today's HTTPS sites
# (type http:// addresses).  Certificates are checked against
# certs/cacert.pem.  on or off.
https_helper=on

# The JIT (being tested): runs the Quadra's 68040 code as ARM code, on the
# 64-bit kernels (Pi 3, 4, 400, 5).  The Mac behaves exactly the same; set
# the speed to unlimited in the menu to see the difference.  on or off.
# Also on the menu's preferences page (takes effect when the menu closes).
jit=off
# One host that broadcasts don't reach (a.b.c.d), or empty.
mac_ethernet_peer=

# Keyboard layout for typing in the menu: uk or us.
keyboard=uk

# The Pi has no battery-backed clock.  The Mac's clock starts here
# ("YYYY-MM-DD HH:MM"); empty = the date the emulator was built.
date=
